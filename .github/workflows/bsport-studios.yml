name: Scrap bsport (The New Me / Sanctuary)

on:
  schedule:
    # 2x/jour (~13h et ~23h Paris). bsport renvoie les séances passées (J-3)
    # avec leur compte DÉFINITIF -> 1 passage/jour suffit pour l'historique
    # complet (3 jours de marge) ; le bouton « Mettre à jour » couvre le live.
    - cron: "0 11,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bsport-studios
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The New Me
        run: python3 thenewme_scrape.py
        continue-on-error: true
      - name: Le Cercle Boxing
        run: python3 lecercle_scrape.py
        continue-on-error: true
      - name: Space Cycle
        run: python3 spacecycle_scrape.py
        continue-on-error: true
      - name: Poses Studio
        run: python3 poses_scrape.py
        continue-on-error: true
      - name: Belly Studio
        run: python3 belly_scrape.py
        continue-on-error: true
      - name: AthletX (Paris République + Neuilly)
        run: python3 athletx_scrape.py
        continue-on-error: true
      - name: Snake & Twist (Arketa)
        run: python3 snakeandtwist_scrape.py
        continue-on-error: true
      - name: DRIP HIIT (Sanctuary Group)
        run: python3 driphiit_scrape.py
        continue-on-error: true
      - name: KORE Studio (Réaumur + Richard-Lenoir)
        run: python3 kore_scrape.py
        continue-on-error: true

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thenewme_data.json thenewme_seances.csv thenewme.html \
                  lecercle_data.json lecercle_seances.csv lecercle.html \
                  spacecycle_data.json spacecycle_seances.csv spacecycle.html \
                  poses_data.json poses_seances.csv poses.html \
                  belly_data.json belly_seances.csv belly.html \
                  athletx_data.json athletx_seances.csv athletx.html \
                  snakeandtwist_data.json snakeandtwist_seances.csv snakeandtwist.html \
                  driphiit_data.json driphiit_seances.csv driphiit.html \
                  kore_data.json kore_seances.csv kore.html
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Scrap bsport ($(date -u +%Y-%m-%dT%H:%M)Z)"
            ok=0
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && { ok=1; break; }
              echo "retry push $i"; sleep 5
            done
            [ "$ok" = 1 ] || { echo "::error::push rejeté 4 fois — les données de ce run ne sont PAS persistées"; exit 1; }
          fi

      - name: Sync vers Supabase (graceful)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 supabase_sync.py
        continue-on-error: true

      - name: Healthcheck ping (si HEALTHCHECK_URL défini)
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: bsport-studios
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
