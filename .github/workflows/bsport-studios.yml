name: Scrap bsport (The New Me / Sanctuary)

on:
  schedule:
    # 2x/jour (~13h et ~23h Paris). bsport renvoie les séances passées (J-3)
    # avec leur compte DÉFINITIF -> 1 passage/jour suffit pour l'historique
    # complet (3 jours de marge) ; le bouton « Mettre à jour » couvre le live.
    - cron: "0 11,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bsport-studios
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: The New Me
        run: python3 thenewme_scrape.py
        continue-on-error: true
      - name: Le Cercle Boxing
        run: python3 lecercle_scrape.py
        continue-on-error: true
      - name: Space Cycle
        run: python3 spacecycle_scrape.py
        continue-on-error: true
      - name: Poses Studio
        run: python3 poses_scrape.py
        continue-on-error: true
      - name: Belly Studio
        run: python3 belly_scrape.py
        continue-on-error: true
      - name: AthletX (Paris République + Neuilly)
        run: python3 athletx_scrape.py
        continue-on-error: true
      - name: Snake & Twist (Arketa)
        run: python3 snakeandtwist_scrape.py
        continue-on-error: true
      - name: DRIP HIIT (Sanctuary Group)
        run: python3 driphiit_scrape.py
        continue-on-error: true
      - name: KORE Studio (Réaumur + Richard-Lenoir)
        run: python3 kore_scrape.py
        continue-on-error: true

      - name: Commit si changement
        run: |
          ./ci_push.sh "Scrap bsport ($(date -u +%Y-%m-%dT%H:%M)Z)" thenewme_data.json thenewme_seances.csv thenewme.html lecercle_data.json lecercle_seances.csv lecercle.html spacecycle_data.json spacecycle_seances.csv spacecycle.html poses_data.json poses_seances.csv poses.html belly_data.json belly_seances.csv belly.html athletx_data.json athletx_seances.csv athletx.html snakeandtwist_data.json snakeandtwist_seances.csv snakeandtwist.html driphiit_data.json driphiit_seances.csv driphiit.html kore_data.json kore_seances.csv kore.html

      - name: Sync vers Supabase (graceful)
        id: sync_supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_API || secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 supabase_sync.py
        continue-on-error: true

      # Le sync reste en continue-on-error pour que le commit du scrape ait
      # lieu quoi qu'il arrive — mais le run doit finir ROUGE s'il a échoué.
      # Sans ce step, 10 jours de 401 (27/09 -> 06/10) sont passés au vert.
      - name: Échec du sync Supabase -> run en rouge
        if: steps.sync_supabase.outcome == 'failure'
        run: |
          echo "::error::Le sync Supabase a échoué : les données de ce run ne sont PAS en base (voir le step de sync)."
          exit 1

      - name: Healthcheck ping (si HEALTHCHECK_URL défini)
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: bsport-studios
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
