name: Fitness extension · discovery + scrape (multi-disciplines)

on:
  schedule:
    - cron: "0 7 * * *"   # 7h UTC = 9h Paris (après pilates + yoga)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fitness-extension
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discovery plateformes fitness général
        run: python3 fitness_extension_discover.py
        continue-on-error: true

      - name: Scrape brands fitness résolues
        run: python3 fitness_extension_scrape.py
        continue-on-error: true

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fitness_extension_resolved.json *_data.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Fitness extension discovery + scrape ($(date -u +%Y-%m-%dT%H:%M)Z)"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
              echo "retry push $i"; sleep 5
            done
          fi

      - name: Healthcheck ping
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: fitness-extension
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
