name: Padel · rattrapage depuis les archives (après une panne)

# Réinjecte dans Supabase les créneaux sortis de la fenêtre vivante pendant
# une panne de sync — cf. padel_backfill_archive.py. Manuel uniquement, et
# idempotent : l'upsert se fait sur la clé métier, relancer ne double rien.
# À lancer APRÈS un sync padel normal réussi.

on:
  workflow_dispatch:
    inputs:
      debut:
        description: "Première date à rattraper (AAAA-MM-JJ)"
        required: true
      fin:
        description: "Dernière date (AAAA-MM-JJ) — vide = J-8, veille de la fenêtre vivante"
        default: ""

permissions:
  contents: read

concurrency:
  group: padel-backfill
  cancel-in-progress: false

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rattrapage padel depuis les archives
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_API || secrets.SUPABASE_ACCESS_TOKEN }}
          BACKFILL_DEBUT: ${{ github.event.inputs.debut }}
          BACKFILL_FIN: ${{ github.event.inputs.fin }}
        run: python3 padel_backfill_archive.py
