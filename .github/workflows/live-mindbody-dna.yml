name: Scrap live · DNA Pilates (Mindbody isolé)

# Mindbody throttle dur quand plusieurs widgets sont scrapés à la chaîne
# avec UA/cookies similaires. Solution : 1 workflow par scraper Mindbody +
# crons décalés. UA spécifique (Mac Safari) dans dna_scrape.py.

on:
  schedule:
    - cron: "15,45 4-21 * * *"   # offset +5min vs live-status (banote :10/:40)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-mindbody-dna
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # PAS de continue-on-error : dna_scrape.py ne sort en erreur que sur une
      # panne prouvée (0 séance rapportée alors que le store en attend encore),
      # jamais sur un planning simplement vide. C'est exactement le signal
      # qu'on veut voir rouge — le run vert de 597 passages muets a coûté
      # une journée de données.
      - name: DNA Pilates (Mindbody, statut)
        run: python3 dna_scrape.py

      - name: Commit si changement
        run: |
          ./ci_push.sh "Scrap DNA Pilates ($(date -u +%Y-%m-%dT%H:%M)Z)" dna_data.json dna_seances.csv dna.html
      - name: Healthcheck ping (si HEALTHCHECK_URL défini)
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: live-mindbody-dna
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
