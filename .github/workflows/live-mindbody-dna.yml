name: Scrap live · DNA Pilates (Mindbody isolé)

# Mindbody throttle dur quand plusieurs widgets sont scrapés à la chaîne
# avec UA/cookies similaires. Solution : 1 workflow par scraper Mindbody +
# crons décalés. UA spécifique (Mac Safari) dans dna_scrape.py.

on:
  schedule:
    - cron: "15,45 4-21 * * *"   # offset +5min vs live-status (banote :10/:40)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-mindbody-dna
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: DNA Pilates (Mindbody, statut)
        run: python3 dna_scrape.py
        continue-on-error: true

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dna_data.json dna_seances.csv dna.html
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Scrap DNA Pilates ($(date -u +%Y-%m-%dT%H:%M)Z)"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
              echo "retry push $i"; sleep 5
            done
          fi
      - name: Healthcheck ping (si HEALTHCHECK_URL défini)
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: live-mindbody-dna
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
