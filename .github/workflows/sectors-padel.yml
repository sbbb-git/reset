name: Padel Île-de-France · 59 clubs Anybuddy

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 min
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sectors-padel
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Scrape 59 clubs IDF (parallèle)
        run: python3 padel_idf_scrape.py

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add padel_idf_data.json padel_idf_creneaux.csv
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Padel IDF scrape ($(date -u +%Y-%m-%dT%H:%M)Z)"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
              echo "retry push $i"; sleep 5
            done
          fi
