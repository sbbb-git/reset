name: Padel IDF · scrape + insights auto (4 plateformes)

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 min
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sectors-padel
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============== SCRAPING 4 PLATEFORMES ==============
      - name: Anybuddy (62 clubs IDF, parallèle x8)
        run: python3 padel_idf_scrape.py
        continue-on-error: true

      - name: UrbanPadel (4 centres IDF)
        run: python3 urbanpadel_scrape.py
        continue-on-error: true

      - name: Doinsport (54 clubs IDF)
        run: python3 doinsport_scrape.py
        continue-on-error: true

      - name: Playtomic (23 clubs IDF, dont Casa Padel)
        run: python3 playtomic_scrape.py
        continue-on-error: true

      # ============== POST-PROCESSING & ANALYTICS ==============
      - name: Recalcul clusters cross-plateforme
        run: python3 padel_unified_compute.py
        continue-on-error: true

      - name: Recalcul KPIs étude marché
        run: python3 padel_kpis_compute.py
        continue-on-error: true

      - name: Recalcul insights stratégiques
        run: python3 padel_insights_compute.py
        continue-on-error: true

      - name: Détection anomalies (idle 24h+, prix shifts, drops volume)
        run: python3 padel_anomalies_compute.py
        continue-on-error: true

      # ============== SYNC SUPABASE ==============
      - name: Sync vers Supabase (padel_clubs + padel_slots)
        id: sync_supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_API || secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 padel_supabase_sync.py
        continue-on-error: true

      # ============== PRUNE STORES (après sync, sinon perte donnée) ==============
      - name: Archive + élague le store (fenêtre 7j passé / 14j futur)
        run: python3 prune_padel_live.py
        continue-on-error: true

      # ============== COMMIT ==============
      - name: Commit si changement
        run: |
          # padel_idf_history.json.gz est OBLIGATOIRE ici : l'élagage y déplace
          # les créneaux sortis de la fenêtre. Sans ce commit, ils seraient
          # archivés dans le runner puis jetés avec lui, alors que le store
          # vivant élagué, lui, serait committé — donc perdus en local.
          ./ci_push.sh "Padel IDF scrape + insights ($(date -u +%Y-%m-%dT%H:%M)Z)" padel_idf_data.json padel_idf_history.json.gz padel_idf_creneaux.csv padel_idf_clubs.json doinsport_idf_clubs.json playtomic_idf_clubs.json padel_club_unified.json padel_etude_kpis.json padel_insights_data.json padel_anomalies.json
      # Le sync reste en continue-on-error pour que le commit du scrape ait
      # lieu quoi qu'il arrive — mais le run doit finir ROUGE s'il a échoué.
      # Sans ce step, 10 jours de 401 (27/09 -> 06/10) sont passés au vert.
      - name: Échec du sync Supabase -> run en rouge
        if: steps.sync_supabase.outcome == 'failure'
        run: |
          echo "::error::Le sync Supabase a échoué : les données de ce run ne sont PAS en base (voir le step de sync)."
          exit 1

      - name: Healthcheck ping (si HEALTHCHECK_URL défini)
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: sectors-padel
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
