name: Scrap live statut (Barry's / Episod / Anybuddy)

on:
  schedule:
    # toutes les 30 min, décalé à :10/:40 (évite la collision de push avec live-senseclub) : ces sources nécessitent de capter
    # le remplissage proche du début de chaque séance (figé ensuite).
    - cron: "10,40 4-21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-status
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Barry's Paris (Mariana Tek)
        run: python3 barrys_scrape.py
        continue-on-error: true
      - name: Episod (resamania / plan de salle)
        run: python3 episod_scrape.py
        continue-on-error: true
      - name: Anybuddy Trinquet Village (occupation terrains)
        run: python3 anybuddy_scrape.py
        continue-on-error: true
      - name: Banote (Mindbody, statut)
        run: python3 banote_scrape.py
        continue-on-error: true
      # DNA + Le33Foch sortis dans live-mindbody-dna.yml / live-mindbody-le33foch.yml
      # (crons décalés pour éviter throttle Mindbody : 3 scrapers Mindbody = 3 workflows)
      - name: Sant-Roch (Mariana Tek)
        run: python3 santroch_scrape.py
        continue-on-error: true

      - name: Commit si changement
        run: |
          ./ci_push.sh "Scrap live statut ($(date -u +%Y-%m-%dT%H:%M)Z)" barrys_data.json barrys_seances.csv barrys.html episod_data.json episod_seances.csv episod.html anybuddy_data.json anybuddy_creneaux.csv anybuddy.html banote_data.json banote_seances.csv banote.html santroch_data.json santroch_seances.csv santroch.html

      - name: Sync vers Supabase (graceful)
        id: sync_supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_API || secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 supabase_sync.py
        continue-on-error: true

      # Le sync reste en continue-on-error pour que le commit du scrape ait
      # lieu quoi qu'il arrive — mais le run doit finir ROUGE s'il a échoué.
      # Sans ce step, 10 jours de 401 (27/09 -> 06/10) sont passés au vert.
      - name: Échec du sync Supabase -> run en rouge
        if: steps.sync_supabase.outcome == 'failure'
        run: |
          echo "::error::Le sync Supabase a échoué : les données de ce run ne sont PAS en base (voir le step de sync)."
          exit 1

      - name: Healthcheck ping (si HEALTHCHECK_URL défini)
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: live-status
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
