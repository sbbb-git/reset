name: Scrap live statut (Barry's / Episod / Anybuddy)

on:
  schedule:
    # toutes les 30 min, décalé à :10/:40 (évite la collision de push avec live-senseclub) : ces sources nécessitent de capter
    # le remplissage proche du début de chaque séance (figé ensuite).
    - cron: "10,40 4-21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-status
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Barry's Paris (Mariana Tek)
        run: python3 barrys_scrape.py
        continue-on-error: true
      - name: Episod (resamania / plan de salle)
        run: python3 episod_scrape.py
        continue-on-error: true
      - name: Anybuddy Trinquet Village (occupation terrains)
        run: python3 anybuddy_scrape.py
        continue-on-error: true
      - name: Banote (Mindbody, statut)
        run: python3 banote_scrape.py
        continue-on-error: true
      - name: Pause anti-throttle Mindbody
        run: sleep 30
      - name: DNA Pilates (Mindbody, statut)
        run: python3 dna_scrape.py
        continue-on-error: true
      - name: Pause anti-throttle Mindbody
        run: sleep 30
      - name: Le 33 Foch (Mindbody, statut)
        run: python3 le33foch_scrape.py
        continue-on-error: true
      - name: Sant-Roch (Mariana Tek)
        run: python3 santroch_scrape.py
        continue-on-error: true

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add barrys_data.json barrys_seances.csv barrys.html \
                  episod_data.json episod_seances.csv episod.html \
                  anybuddy_data.json anybuddy_creneaux.csv anybuddy.html \
                  banote_data.json banote_seances.csv banote.html \
                  dna_data.json dna_seances.csv dna.html \
                  le33foch_data.json le33foch_seances.csv le33foch.html \
                  santroch_data.json santroch_seances.csv santroch.html
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Scrap live statut ($(date -u +%Y-%m-%dT%H:%M)Z)"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
              echo "retry push $i"; sleep 5
            done
          fi

      - name: Sync vers Supabase (graceful)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 supabase_sync.py
        continue-on-error: true

      - name: Healthcheck ping (si HEALTHCHECK_URL défini)
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: live-status
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
