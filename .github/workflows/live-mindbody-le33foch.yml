name: Scrap live · Le 33 Foch (Mindbody isolé)

# Mindbody throttle dur si plusieurs widgets scrapés à la chaîne.
# Workflow isolé avec UA Firefox Linux différent.

on:
  schedule:
    - cron: "20,50 4-21 * * *"   # offset +10min vs live-status, +5 vs dna
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-mindbody-le33foch
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Playwright (fallback throttle Mindbody)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Le 33 Foch (HTTP + fallback Playwright si throttle)
        # Pas de continue-on-error, comme DNA : le script ne sort en erreur que
        # sur une panne prouvée (0 séance alors que la base en attend). Le run
        # est resté vert du 05/10 au 07/10 sans rien rapporter.
        run: python3 le33foch_scrape.py

      - name: Commit si changement
        run: |
          ./ci_push.sh "Scrap Le 33 Foch ($(date -u +%Y-%m-%dT%H:%M)Z)" le33foch_data.json le33foch_seances.csv le33foch.html
      - name: Healthcheck ping (si HEALTHCHECK_URL défini)
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: live-mindbody-le33foch
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
