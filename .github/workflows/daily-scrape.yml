name: Scrap quotidien Re-SET

on:
  schedule:
    # 04:00 UTC = 06:00 Paris (CEST), tous les matins -> chiffres de la veille
    - cron: "0 4 * * *"
  workflow_dispatch: {}   # permet aussi de lancer a la main

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dependances
        run: pip install openpyxl

      - name: Scrap Re-SET (de l'ouverture jusqu'a hier)
        run: python3 reset_scrape.py

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reset_seances.csv reset_seances.xlsx reset.html reset_data.json
          if git diff --cached --quiet; then
            echo "Aucun changement, rien a committer."
          else
            git commit -m "Scrap quotidien automatique ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Sync vers Supabase (graceful)
        id: sync_supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_API || secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 supabase_sync.py
        continue-on-error: true

      # Le sync reste en continue-on-error pour que le commit du scrape ait
      # lieu quoi qu'il arrive — mais le run doit finir ROUGE s'il a échoué.
      # Sans ce step, 10 jours de 401 (27/09 -> 06/10) sont passés au vert.
      - name: Échec du sync Supabase -> run en rouge
        if: steps.sync_supabase.outcome == 'failure'
        run: |
          echo "::error::Le sync Supabase a échoué : les données de ce run ne sont PAS en base (voir le step de sync)."
          exit 1

      - name: Healthcheck ping (si HEALTHCHECK_URL défini)
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: daily-scrape
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
