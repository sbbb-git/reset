name: Scrap quotidien Re-SET

on:
  schedule:
    # 05:00 UTC = ~07:00 Paris, tous les matins
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # permet aussi de lancer a la main

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances
        run: pip install openpyxl

      - name: Scrap Re-SET (de l'ouverture jusqu'a hier)
        run: python3 reset_scrape.py

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reset_seances.csv reset_seances.xlsx index.html
          if git diff --cached --quiet; then
            echo "Aucun changement, rien a committer."
          else
            git commit -m "Scrap quotidien automatique ($(date -u +%Y-%m-%d))"
            git push
          fi
