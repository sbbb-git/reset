name: Reformation + Evocore · scrape via Playwright (quotidien)

# Ces 2 widgets Mindbody sont des SPAs : nécessitent un navigateur réel
# (Playwright) au lieu d'un simple requests.get. Schedule plus rare car
# Mindbody throttle vite et le statut "complet/des places" évolue lentement.

on:
  schedule:
    - cron: "20 5 * * *"   # 5h20 UTC = 7h20 Paris, avant la pointe matinale
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: reformation-evocore
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scrape Reformation + Evocore
        run: python3 reformation_evocore_scrape.py
        continue-on-error: true

      - name: Commit si changement
        run: |
          ./ci_push.sh "Reformation + Evocore Playwright scrape ($(date -u +%Y-%m-%dT%H:%M)Z)" reformation_data.json evocore_data.json
      - name: Healthcheck ping (si HEALTHCHECK_URL défini)
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: reformation-evocore
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
