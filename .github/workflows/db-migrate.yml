name: Base · exécuter une migration SQL

# Joue un fichier SQL du dépôt contre Supabase.
#
# DEUX VOIES, dans cet ordre de préférence :
#
#  1. API Management (secret SUPABASE_ACCESS_TOKEN) — du HTTPS ordinaire vers
#     api.supabase.com. Rien à trouver dans l'interface : un jeton se crée sur
#     supabase.com/dashboard/account/tokens, et l'identifiant du projet est
#     déduit de SUPABASE_URL, déjà en secret. Les instructions partent une par
#     une, ce qui permet VACUUM (qu'on ne peut pas grouper) et dit exactement
#     laquelle casse en cas d'erreur.
#
#  2. psql (secret SUPABASE_DB_URL) — plus direct, mais l'hôte
#     db.<ref>.supabase.co ne résout qu'en IPv6 et les runners GitHub n'en ont
#     pas. Il faut donc la chaîne du pooler en port 5432 (mode session).
#
# La voie 1 suffit et demande moins. La voie 2 reste là si le jeton n'est pas
# souhaité.
#
# Déclenchement MANUEL uniquement, jamais de schedule, et seuls les fichiers
# de la liste ci-dessous sont acceptés : ce workflow ne doit jamais pouvoir
# exécuter du SQL arbitraire.

on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "Fichier SQL à exécuter"
        required: true
        type: choice
        options:
          - supabase_levier3_rollup.sql
          - supabase_levier1_vacuum.sql
          - supabase_levier2a_preparation.sql
          - supabase_levier2b_bascule.sql
          - supabase_indexes.sql
          - supabase_migration_padel_slots.sql
      confirmer:
        description: "Taper JOUER pour confirmer (certains fichiers suppriment des lignes)"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Garde-fous
        env:
          FICHIER: ${{ github.event.inputs.fichier }}
          CONFIRMER: ${{ github.event.inputs.confirmer }}
        run: |
          if [ "$CONFIRMER" != "JOUER" ]; then
            echo "::error::confirmation manquante — taper JOUER"; exit 1
          fi
          autorises="supabase_levier1_vacuum.sql
          supabase_levier2a_preparation.sql
          supabase_levier2b_bascule.sql
          supabase_levier3_rollup.sql
          supabase_indexes.sql
          supabase_migration_padel_slots.sql"
          if ! echo "$autorises" | tr -d ' ' | grep -qx "$FICHIER"; then
            echo "::error::fichier hors liste : $FICHIER"; exit 1
          fi
          test -f "$FICHIER" || { echo "::error::$FICHIER introuvable"; exit 1; }
          echo "OK : $FICHIER"

      - name: Choisir la voie
        id: voie
        env:
          JETON: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$JETON" ]; then
            echo "methode=api" >> "$GITHUB_OUTPUT"
            echo "Voie retenue : API Management."
            exit 0
          fi
          if [ -n "$PGURL" ]; then
            case "$PGURL" in
              *db.*.supabase.co*)
                echo "::error::SUPABASE_DB_URL pointe sur l'hôte DIRECT, qui"
                echo "::error::est IPv6 uniquement — inaccessible depuis un"
                echo "::error::runner GitHub. Deux issues :"
                echo "::error:: · plus simple : créer un jeton sur"
                echo "::error::   supabase.com/dashboard/account/tokens et"
                echo "::error::   l'ajouter en secret SUPABASE_ACCESS_TOKEN ;"
                echo "::error:: · ou reprendre la chaîne du pooler en port 5432."
                exit 1 ;;
              *pooler.supabase.com:6543*)
                echo "::error::port 6543 = pooler en mode TRANSACTION, où"
                echo "::error::VACUUM et une partie du DDL sont refusés."
                echo "::error::Utiliser le port 5432 (mode session)."
                exit 1 ;;
            esac
            echo "methode=psql" >> "$GITHUB_OUTPUT"
            echo "Voie retenue : psql."
            exit 0
          fi
          echo "::error::aucun secret utilisable. Le plus simple : créer un"
          echo "::error::jeton sur supabase.com/dashboard/account/tokens et"
          echo "::error::l'ajouter en secret SUPABASE_ACCESS_TOKEN."
          exit 1

      - name: Exécuter via l'API Management
        if: steps.voie.outputs.methode == 'api'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SQL_FILE: ${{ github.event.inputs.fichier }}
        run: python3 supabase_exec_sql.py

      - name: Exécuter via psql
        if: steps.voie.outputs.methode == 'psql'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
          FICHIER: ${{ github.event.inputs.fichier }}
        run: psql "$PGURL" -v ON_ERROR_STOP=1 --echo-errors -f "$FICHIER"

      - name: Taille après
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            printf '%s\n' \
              "SELECT pg_size_pretty(pg_database_size(current_database())) AS base_totale;" \
              > /tmp/taille.sql
            SQL_FILE=/tmp/taille.sql python3 supabase_exec_sql.py || true
          fi
