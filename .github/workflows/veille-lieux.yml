name: Veille · nouveaux lieux IDF (bsport)

# Recense l'espace des companies bsport et signale les enseignes d'Île-de-France
# qu'on ne scrape pas encore. Deux temps dans chaque passage : la frontière
# (les identifiants les plus hauts, donc les inscriptions récentes — c'est la
# veille proprement dite), puis un lot de rattrapage sur le reste de l'espace.
# Hebdomadaire : les ouvertures ne se comptent pas en heures, et le balayage
# fait quelques milliers d'appels.

on:
  schedule:
    - cron: "20 5 * * 1"   # lundi 5h20 UTC, hors des pics de scrape
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veille-lieux
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Balayage bsport (frontière + rattrapage)
        run: python3 veille_lieux_discover.py

      - name: Commit si changement
        run: |
          ./ci_push.sh "Veille lieux IDF ($(date -u +%Y-%m-%dT%H:%M)Z)" veille_lieux_etat.json veille_nouveaux_lieux.json veille.html

      - name: Healthcheck ping
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: veille-lieux
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
