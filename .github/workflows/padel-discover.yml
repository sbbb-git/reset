name: Padel · Auto-discovery hebdo (nouveaux clubs IDF)

on:
  schedule:
    - cron: "0 5 * * 1"   # Lundi 5h UTC = 7h Paris
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: padel-discover
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-scan plateformes pour nouveaux clubs IDF
        run: python3 padel_discover.py

      - name: Commit si nouveaux clubs trouvés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add padel_idf_clubs.json doinsport_idf_clubs.json playtomic_idf_clubs.json
          if git diff --cached --quiet; then
            echo "Aucun nouveau club détecté."
          else
            git commit -m "Auto-discovery padel ($(date -u +%Y-%m-%d)) : nouveaux clubs IDF"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
              echo "retry push $i"; sleep 5
            done
          fi
