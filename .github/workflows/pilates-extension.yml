name: Pilates extension · 44 studios discovery + scrape

# Lance la discovery des plateformes (1× / jour) puis le scrape unifié.
# Les brands résolues alimentent automatiquement pilates_idf_data.json
# au prochain run de pilates-aggregate.yml.

on:
  schedule:
    - cron: "30 6 * * *"   # 6h30 UTC = 8h30 Paris
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pilates-extension
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discovery plateformes (re-tente brands unknown)
        run: python3 pilates_extension_discover.py
        continue-on-error: true

      - name: Scrape unifié des brands résolues
        run: python3 pilates_extension_scrape.py
        continue-on-error: true

      - name: Recalcul agrégat Pilates IDF (inclut les nouvelles brands)
        run: python3 pilates_idf_compute.py
        continue-on-error: true

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilates_extension_resolved.json pilates_idf_data.json *_data.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Pilates extension discovery + scrape ($(date -u +%Y-%m-%dT%H:%M)Z)"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
              echo "retry push $i"; sleep 5
            done
          fi

      - name: Healthcheck ping
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: pilates-extension
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
