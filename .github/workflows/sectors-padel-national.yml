name: Padel National · scrape FR métropolitaine (toutes les 2h)

on:
  schedule:
    - cron: "15 */2 * * *"   # toutes les 2h à minute 15 (pour pas chevaucher avec sectors-padel IDF)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sectors-padel-national
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Re-discover catalogue (au cas où nouveaux clubs ajoutés)
        run: python3 padel_national_discover.py
        continue-on-error: true
        timeout-minutes: 12

      - name: Scrape national 4 plateformes
        run: python3 padel_national_scrape.py

      - name: Backfill GPS (catalogue + Nominatim opt-in)
        env:
          USE_NOMINATIM: "1"
        run: python3 padel_geocode_backfill.py
        continue-on-error: true

      - name: Push national → Supabase (source of truth)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 padel_national_supabase_sync.py
        continue-on-error: true

      # Le step « Reconstruct local JSON depuis Supabase » a été retiré.
      # Il rapatriait TOUT l'historique national (~700 k lignes, sans aucun
      # filtre de date) juste avant que prune_padel_live.py n'en jette 95 % au
      # step suivant : le store repartait à 21 jours dans tous les cas. Coût
      # pur, effet nul. Le store vit désormais dans git avec son archive .gz,
      # donc le repli que ce rapatriement assurait n'a plus d'objet — et après
      # le rollup, Supabase ne détient de toute façon plus que la fenêtre
      # courante.

      - name: Archive + élague le store (fenêtre 7j passé / 14j futur)
        run: python3 prune_padel_live.py
        continue-on-error: true

      - name: Commit si changement
        run: |
          # padel_national_history.json.gz est OBLIGATOIRE : l'élagage y déplace
          # les créneaux hors fenêtre. Sans ce commit ils partiraient avec le
          # runner, alors que le store élagué serait committé — donc perdus.
          ./ci_push.sh "Padel national scrape ($(date -u +%Y-%m-%dT%H:%M)Z)" padel_national_data.json padel_national_history.json.gz padel_national_anybuddy.json padel_national_doinsport.json padel_national_playtomic.json padel_national_urbanpadel.json padel_national_clubs.json

      - name: Healthcheck ping (si HEALTHCHECK_URL défini)
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: sectors-padel-national
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
