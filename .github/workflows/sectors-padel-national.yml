name: Padel National · scrape FR métropolitaine (toutes les 2h)

on:
  schedule:
    - cron: "15 */2 * * *"   # toutes les 2h à minute 15 (pour pas chevaucher avec sectors-padel IDF)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sectors-padel-national
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Re-discover catalogue (au cas où nouveaux clubs ajoutés)
        run: python3 padel_national_discover.py
        continue-on-error: true
        timeout-minutes: 12

      - name: Scrape national 4 plateformes
        run: python3 padel_national_scrape.py

      - name: Backfill GPS (catalogue + Nominatim opt-in)
        env:
          USE_NOMINATIM: "1"
        run: python3 padel_geocode_backfill.py
        continue-on-error: true

      - name: Push national → Supabase (source of truth)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 padel_national_supabase_sync.py
        continue-on-error: true

      - name: Reconstruct local JSON depuis Supabase (backward-compat)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 padel_national_from_supabase.py
        continue-on-error: true

      - name: Archive + élague le store (fenêtre 7j passé / 14j futur)
        run: python3 prune_padel_live.py
        continue-on-error: true

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # padel_national_history.json.gz est OBLIGATOIRE : l'élagage y déplace
          # les créneaux hors fenêtre. Sans ce commit ils partiraient avec le
          # runner, alors que le store élagué serait committé — donc perdus.
          git add padel_national_data.json padel_national_history.json.gz \
                  padel_national_anybuddy.json padel_national_doinsport.json \
                  padel_national_playtomic.json padel_national_urbanpadel.json \
                  padel_national_clubs.json
          if git diff --cached --quiet; then
            echo "Aucun changement national."
          else
            git commit -m "Padel national scrape ($(date -u +%Y-%m-%dT%H:%M)Z)"
            ok=0
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && { ok=1; break; }
              echo "retry push $i"; sleep 5
            done
            [ "$ok" = 1 ] || { echo "::error::push rejeté 4 fois — les données de ce run ne sont PAS persistées"; exit 1; }
          fi

      - name: Healthcheck ping (si HEALTHCHECK_URL défini)
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: sectors-padel-national
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
