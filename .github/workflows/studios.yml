name: Scrap studios Monday (Punch / Dynamo / Riise)

on:
  schedule:
    # chaque soir ~23:00 Paris (21:00 UTC), après la dernière séance -> présences finales du jour
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: studios-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrap Punch
        run: python3 punch_scrape.py
        continue-on-error: true

      - name: Scrap Dynamo
        run: python3 dynamo_scrape.py
        continue-on-error: true

      - name: Scrap Riise
        run: python3 riise_scrape.py
        continue-on-error: true

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add punch_data.json punch_seances.csv punch.html \
                  dynamo_data.json dynamo_seances.csv dynamo.html \
                  riise_data.json riise_seances.csv riise.html
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Scrap studios ($(date -u +%Y-%m-%dT%H:%M)Z)"
            ok=0
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && { ok=1; break; }
              echo "retry push $i"; sleep 5
            done
            [ "$ok" = 1 ] || { echo "::error::push rejeté 4 fois — les données de ce run ne sont PAS persistées"; exit 1; }
          fi

      - name: Sync vers Supabase (graceful)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 supabase_sync.py
        continue-on-error: true

      - name: Healthcheck ping (si HEALTHCHECK_URL défini)
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: studios
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
