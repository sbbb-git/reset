name: Scrap studios Monday (Punch / Dynamo / Riise)

on:
  schedule:
    # chaque soir ~23:00 Paris (21:00 UTC), après la dernière séance -> présences finales du jour
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: studios-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scrap Punch
        run: python3 punch_scrape.py
        continue-on-error: true

      - name: Scrap Dynamo
        run: python3 dynamo_scrape.py
        continue-on-error: true

      - name: Scrap Riise
        run: python3 riise_scrape.py
        continue-on-error: true

      - name: Commit si changement
        run: |
          ./ci_push.sh "Scrap studios ($(date -u +%Y-%m-%dT%H:%M)Z)" punch_data.json punch_seances.csv punch.html dynamo_data.json dynamo_seances.csv dynamo.html riise_data.json riise_seances.csv riise.html

      - name: Sync vers Supabase (graceful)
        id: sync_supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_API || secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 supabase_sync.py
        continue-on-error: true

      # Le sync reste en continue-on-error pour que le commit du scrape ait
      # lieu quoi qu'il arrive — mais le run doit finir ROUGE s'il a échoué.
      # Sans ce step, 10 jours de 401 (27/09 -> 06/10) sont passés au vert.
      - name: Échec du sync Supabase -> run en rouge
        if: steps.sync_supabase.outcome == 'failure'
        run: |
          echo "::error::Le sync Supabase a échoué : les données de ce run ne sont PAS en base (voir le step de sync)."
          exit 1

      - name: Healthcheck ping (si HEALTHCHECK_URL défini)
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: studios
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
