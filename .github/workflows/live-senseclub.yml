name: Capture live (Sense-Club + Burning Bar)

on:
  schedule:
    # toutes les 30 min entre 04:00 et 21:00 UTC (~06:00-23:00 Paris)
    - cron: "*/30 4-21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-senseclub
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Cache navigateur Playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.56.1

      - name: Installer Playwright
        run: |
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Capture Sense-Club (statut figé ~10 min avant)
        run: python3 senseclub_scrape.py
        continue-on-error: true

      - name: Capture Burning Bar (statut figé ~10 min avant)
        run: python3 burningbar_scrape.py
        continue-on-error: true

      - name: Commit si changement
        run: |
          ./ci_push.sh "Capture Sense-Club ($(date -u +%Y-%m-%dT%H:%M)Z)" senseclub_data.json senseclub_seances.csv senseclub.html burningbar_data.json burningbar_seances.csv burningbar.html

      - name: Sync vers Supabase (graceful)
        id: sync_supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_API || secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 supabase_sync.py
        continue-on-error: true

      # Le sync reste en continue-on-error pour que le commit du scrape ait
      # lieu quoi qu'il arrive — mais le run doit finir ROUGE s'il a échoué.
      # Sans ce step, 10 jours de 401 (27/09 -> 06/10) sont passés au vert.
      - name: Échec du sync Supabase -> run en rouge
        if: steps.sync_supabase.outcome == 'failure'
        run: |
          echo "::error::Le sync Supabase a échoué : les données de ce run ne sont PAS en base (voir le step de sync)."
          exit 1

      - name: Healthcheck ping (si HEALTHCHECK_URL défini)
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          WF: live-senseclub
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsSL --max-time 10 "$HC_URL/$WF?status=${{ job.status }}" || true
          fi
