name: Capture live (Sense-Club + Burning Bar)

on:
  schedule:
    # toutes les 15 min entre 04:00 et 21:00 UTC (~06:00-23:00 Paris)
    - cron: "*/15 4-21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-senseclub
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache navigateur Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.56.1

      - name: Installer Playwright
        run: |
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Capture Sense-Club (statut figé ~10 min avant)
        run: python3 senseclub_scrape.py
        continue-on-error: true

      - name: Capture Burning Bar (statut figé ~10 min avant)
        run: python3 burningbar_scrape.py
        continue-on-error: true

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add senseclub_data.json senseclub_seances.csv senseclub.html \
                  burningbar_data.json burningbar_seances.csv burningbar.html
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Capture Sense-Club ($(date -u +%Y-%m-%dT%H:%M)Z)"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
              echo "retry push $i"; sleep 5
            done
          fi
