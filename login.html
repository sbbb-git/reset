<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>·</title>
<style>
  :root{--bg:#0a0e1a;--card:#121828;--card2:#1a2238;--line:#2a3354;--text:#eef1fb;--accent:#6f82ff;--red:#e07a6f;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  body{display:flex;align-items:center;justify-content:center;padding:24px;}
  form{display:flex;flex-direction:column;gap:10px;width:320px;max-width:100%;}
  input{width:100%;background:var(--card2);color:var(--text);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;font-size:15px;font-family:inherit;}
  input:focus{outline:none;border-color:var(--accent);}
  button{width:100%;background:var(--accent);color:#0a0e1a;border:none;border-radius:10px;padding:14px;font-size:14px;font-weight:800;cursor:pointer;letter-spacing:.4px;}
  button:hover{filter:brightness(1.1);}
  .err{color:var(--red);font-size:12px;text-align:center;min-height:14px;}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <input id="p" type="password" placeholder="" required autofocus>
  <button type="submit">→</button>
  <div id="msg" class="err"></div>
</form>
<script>
const DEFAULT_HASH = 'b25e0f72478441d4385e3c89a07bd4722f9df0787d84980507fd679dad998a52';
async function sha256(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function currentHash(){ return localStorage.getItem('auth_hash') || DEFAULT_HASH; }

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg'); msg.textContent = '';
  const h = await sha256(document.getElementById('p').value);
  if (h === currentHash()) {
    sessionStorage.setItem('auth_ok','1');
    const next = new URLSearchParams(location.search).get('next') || 'hub.html';
    location.replace(next);
  } else {
    msg.textContent = '✗';
    document.getElementById('p').select();
  }
});

if (sessionStorage.getItem('auth_ok') === '1') {
  const next = new URLSearchParams(location.search).get('next') || 'hub.html';
  location.replace(next);
}
</script>
</body>
</html>
