<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authentification requise</title>
<style>
  :root{--bg:#0a0e1a;--card:#121828;--card2:#1a2238;--line:#2a3354;--text:#eef1fb;
        --muted:#8a96b8;--accent:#6f82ff;--accent2:#a7b3ff;--red:#e07a6f;--green:#5fcf8a;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  body{display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(900px 450px at 25% 30%,rgba(111,130,255,.18),transparent 60%),radial-gradient(700px 350px at 75% 70%,rgba(44,223,98,.10),transparent 60%);}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 32px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.4);}
  h1{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.3px;}
  .sub{color:var(--muted);font-size:13px;margin:0 0 24px;}
  label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px;}
  input{width:100%;background:var(--card2);color:var(--text);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;font-family:inherit;}
  input:focus{outline:none;border-color:var(--accent);}
  button{width:100%;background:var(--accent);color:#0a0e1a;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;margin-top:16px;letter-spacing:.4px;}
  button:hover{filter:brightness(1.1);}
  .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:18px;}
  .ok{color:var(--green);}
  .lock{font-size:32px;text-align:center;margin-bottom:8px;}
  .note{color:var(--muted);font-size:11px;margin-top:18px;text-align:center;line-height:1.5;}
</style>
</head>
<body>
  <div class="box">
    <div class="lock">🔒</div>
    <h1>Accès protégé</h1>
    <p class="sub">Saisis le mot de passe pour accéder aux dashboards.</p>
    <form id="f" autocomplete="off">
      <label for="p">Mot de passe</label>
      <input id="p" type="password" required autofocus>
      <button type="submit">Déverrouiller</button>
      <div id="msg" class="err"></div>
    </form>
    <div class="note">Dashboards fitness boutique + padel IDF & national. Session conservée jusqu'à la fermeture du navigateur.</div>
  </div>
<script>
// SHA-256 hash de "Reset2026!" — pour changer le pass, remplacer cette valeur par hash du nouveau pass.
// Calcul rapide en console : crypto.subtle.digest('SHA-256', new TextEncoder().encode('TON_PASS')).then(b=>console.log(Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')))
const HASH = '7dc4538d67147b64eb2aa4b684c0ec05b7ca7ed1e80b28593ef28ab56ed4a220';

async function sha256(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  msg.className = 'err';
  const pass = document.getElementById('p').value;
  const h = await sha256(pass);
  if (h === HASH) {
    sessionStorage.setItem('auth_ok','1');
    msg.className = 'ok'; msg.textContent = '✓ Accès accordé · redirection…';
    const next = new URLSearchParams(location.search).get('next') || 'hub.html';
    setTimeout(()=>location.replace(next), 300);
  } else {
    msg.textContent = 'Mot de passe incorrect.';
    document.getElementById('p').select();
  }
});

// Si déjà loggé, redirige direct
if (sessionStorage.getItem('auth_ok') === '1') {
  const next = new URLSearchParams(location.search).get('next') || 'hub.html';
  location.replace(next);
}
</script>
</body>
</html>
