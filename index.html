<!DOCTYPE html>
<html lang="fr">
<head>
<script>if(location.hash==="#reset"){location.replace("404.html");}</script>
<script>if(sessionStorage.getItem("auth_ok")!=="1")location.replace("login.html?next="+encodeURIComponent(location.pathname+location.search+location.hash));</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil</title>
<style>
  :root{--bg:#0a0e1a;--card:#121828;--line:#2a3354;--text:#eef1fb;--muted:#8a96b8;--accent:#6f82ff;--accent2:#a7b3ff;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;
    background:radial-gradient(900px 500px at 30% 25%,rgba(111,130,255,.16),transparent 60%),
               radial-gradient(800px 500px at 75% 75%,rgba(44,223,98,.10),transparent 60%);}
  h1{margin:0 0 14px;font-size:42px;font-weight:800;letter-spacing:-.8px;}
  p.lead{color:var(--muted);font-size:16px;margin:0 0 36px;text-align:center;max-width:520px;line-height:1.6;}
  a.btn{display:inline-block;background:var(--accent);color:#fff;padding:18px 36px;
    border-radius:14px;font-size:17px;font-weight:700;text-decoration:none;
    letter-spacing:.3px;transition:transform .12s, box-shadow .12s, background .12s;
    box-shadow:0 10px 30px rgba(111,130,255,.35);}
  a.btn:hover{transform:translateY(-2px);background:var(--accent2);
    box-shadow:0 14px 40px rgba(111,130,255,.5);}
  .foot{margin-top:48px;color:var(--muted);font-size:11.5px;text-align:center;}
  .foot a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent;}
  .foot a:hover{border-bottom-color:var(--muted);}
</style>
</head>
<body>

  <h1>🎯</h1>
  <p class="lead">Observatoire data privé · fitness boutique · padel IDF · pilates · yoga · bien-être</p>

  <a class="btn" href="hub.html">Entrer dans le hub →</a>

  <div class="foot">
    <a href="javascript:sessionStorage.removeItem('auth_ok');location.href='login.html'">se déconnecter</a>
    &middot;
    <a href="password.html">changer mot de passe</a>
  </div>

</body>
</html>
