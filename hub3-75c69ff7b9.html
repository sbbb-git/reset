<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboards · Barry's & Episod</title>
<style>
  :root{--bg:#0c1020;--bar:#141a30;--line:#2a3358;--text:#eef1fb;--muted:#97a1c8;--accent:#e2231a;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;}
  .tabs{display:flex;gap:6px;padding:10px 12px;background:var(--bar);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:10;flex:0 0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tabs button{flex:0 0 auto;background:transparent;color:var(--muted);border:1px solid transparent;
    border-radius:10px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;
    -webkit-tap-highlight-color:transparent;}
  .tabs button.active{color:#fff;background:var(--accent);}
  .frames{position:relative;flex:1 1 auto;min-height:0;}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);}
  iframe[hidden]{display:none;}
</style>
</head>
<body>
  <nav class="tabs">
    <button data-t="barrys" class="active" style="--accent:#e2231a">Barry's</button>
  </nav>
  <div class="frames">
    <iframe id="f-barrys" src="barrys.html" title="Barry's"></iframe>
  </div>
<script>
  const order=['barrys'];
  const btns=document.querySelectorAll('.tabs button');
  const frames={};order.forEach(t=>frames[t]=document.getElementById('f-'+t));
  function show(t){
    if(!frames[t])t=order[0];
    btns.forEach(b=>b.classList.toggle('active',b.dataset.t===t));
    Object.entries(frames).forEach(([k,f])=>{const on=k===t;if(on&&!f.src&&f.dataset.src){f.src=f.dataset.src;}f.hidden=!on;});
    try{location.hash=t;}catch(e){}
  }
  btns.forEach(b=>b.addEventListener('click',()=>show(b.dataset.t)));
  show((location.hash||'').replace('#','')||order[0]);
</script>
</body>
</html>
