<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page introuvable</title>
<style>
  :root{--bg:#0a0e1a;--card:#121828;--line:#2a3354;--text:#eef1fb;--muted:#8a96b8;--accent:#6f82ff;--red:#e07a6f;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  body{display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;}
  .box{max-width:440px;}
  .code{font-size:84px;font-weight:900;color:var(--red);line-height:1;letter-spacing:-2px;}
  h1{margin:14px 0 6px;font-size:22px;font-weight:800;}
  p{color:var(--muted);font-size:14px;margin:0 0 22px;}
  a{display:inline-block;background:var(--accent);color:#0a0e1a;padding:11px 22px;border-radius:9px;font-size:13px;font-weight:800;text-decoration:none;letter-spacing:.4px;}
  a:hover{filter:brightness(1.1);}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>Page introuvable</h1>
  <p>Cette URL n'existe pas.</p>
  <a href="/reset/">← Retour à l'accueil</a>
</div>
</body>
</html>
