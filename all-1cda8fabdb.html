<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tous les studios · Fréquentation</title>
<style>
  :root{--bg:#0c1020;--bar:#141a30;--line:#2a3358;--text:#eef1fb;--muted:#97a1c8;--accent:#6f82ff;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;}
  .tabs{display:flex;gap:6px;padding:10px 12px;background:var(--bar);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:10;flex:0 0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tabs button{flex:0 0 auto;background:transparent;color:var(--muted);border:1px solid var(--line);
    border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;
    -webkit-tap-highlight-color:transparent;}
  .tabs button.active{color:#fff;background:var(--accent);border-color:transparent;}
  .frames{position:relative;flex:1 1 auto;min-height:0;}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);}
  iframe[hidden]{display:none;}
</style>
</head>
<body>
  <nav class="tabs" id="tabs"></nav>
  <div class="frames" id="frames"></div>
<script>
  const STUDIOS=[
    ["comparateur","📊 Comparateur","comparateur.html","#6f82ff"],
    ["reset","Re-SET","reset.html","#d98b63"],
    ["punch","Punch","punch.html","#263fff"],
    ["dynamo","Dynamo","dynamo.html","#faa619"],
    ["riise","Riise","riise.html","#c25a3f"],
    ["senseclub","Sense-Club","senseclub.html","#9b7ff0"],
    ["thenewme","The New Me","thenewme.html","#b8895e"],
    ["lecercle","Le Cercle","lecercle.html","#d4453a"],
    ["spacecycle","Space Cycle","spacecycle.html","#16b3c6"],
    ["poses","Poses","poses.html","#b06a8f"],
    ["barrys","Barry's","barrys.html","#e2231a"],
    ["episod","Episod","episod.html","#e8c14d"],
    ["belly","Belly Studio","belly.html","#e0699b"],
    ["athletx","AthletX","athletx.html","#e0322c"],
    ["dna","DNA Pilates","dna.html","#c9a24b"],
    ["le33foch","Le 33 Foch","le33foch.html","#c4a361"],
    ["banote","Banote","banote.html","#c9a24b"],
    ["santroch","Sant-Roch","santroch.html","#4a7c7e"],
    ["burningbar","Burning Bar","burningbar.html","#ff5a1f"],
    ["anybuddy","Trinquet (padel)","anybuddy.html","#3fa796"],
  ];
  const tabs=document.getElementById('tabs'),frames=document.getElementById('frames'),fr={};
  STUDIOS.forEach(([k,label,src,acc],i)=>{
    const b=document.createElement('button');b.textContent=label;b.dataset.t=k;b.style.setProperty('--accent',acc);
    b.addEventListener('click',()=>show(k));tabs.appendChild(b);
    const f=document.createElement('iframe');f.id='f-'+k;f.title=label;f.dataset.src=src;f.hidden=true;
    frames.appendChild(f);fr[k]=f;
  });
  function show(t){
    if(!fr[t])t=STUDIOS[0][0];
    tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
    Object.entries(fr).forEach(([k,f])=>{const on=k===t;if(on&&!f.src)f.src=f.dataset.src;f.hidden=!on;});
    try{location.hash=t;}catch(e){}
  }
  show((location.hash||'').replace('#','')||STUDIOS[0][0]);
</script>
</body>
</html>
